<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CloudGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cloudguard.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-dot"></span> CloudGuard
    </div>
    <p class="auth-sub">Sign in to continue.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="auth-foot">CloudGuard · secret exposure detection</p>
  </div>
</body>
</html>
